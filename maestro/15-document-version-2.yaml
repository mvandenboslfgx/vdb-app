appId: nl.vdbdigital.app
---
# 15 — Document request-changes controls
- clearState
- launchApp
- runFlow:
    file: shared/login.yaml
    env:
      EMAIL: customer.a@local.vdb
- extendedWaitUntil:
    visible:
      id: "customer-dashboard-screen"
    timeout: 30000
- tapOn:
    id: "tab-customer-more"
- tapOn:
    id: "nav-documents"
- tapOn:
    id: "document-row-0"
- assertVisible:
    id: "screen-document-detail"
- tapOn:
    id: "input-document-comment"
    optional: true
- inputText: "Maestro change request"
- assertVisible:
    id: "btn-document-request-changes"
- takeScreenshot: "15-document-version-2"
