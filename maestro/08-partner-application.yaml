appId: nl.vdbdigital.app
---
# 08 - Partner application form
- clearState
- launchApp
- runFlow:
    file: shared/login.yaml
    env:
      EMAIL: customer.b@local.vdb
- extendedWaitUntil:
    visible:
      id: "customer-dashboard-screen"
    timeout: 60000
- tapOn:
    id: "tab-customer-more"
- tapOn:
    id: "nav-partner-apply"
- assertVisible:
    id: "screen-partner-apply"
- tapOn:
    id: "input-partner-apply-company"
    optional: true
- inputText: "Maestro Partner BV"
- tapOn:
    id: "btn-partner-apply-accept-terms"
    optional: true
- tapOn:
    id: "btn-partner-apply-submit"
    optional: true
- takeScreenshot: "08-partner-application"
