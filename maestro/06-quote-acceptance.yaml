appId: nl.vdbdigital.app
---
# 06 — Quote acceptance path (terms + accept visible)
- clearState
- launchApp
- runFlow:
    file: shared/login.yaml
    env:
      EMAIL: customer.a@local.vdb
- extendedWaitUntil:
    visible:
      id: "customer-dashboard-screen"
    timeout: 30000
- tapOn:
    id: "tab-customer-more"
- tapOn:
    id: "nav-quotes"
- tapOn:
    id: "quote-row-0"
- assertVisible:
    id: "screen-quote-detail"
- tapOn:
    id: "checkbox-quote-terms"
    optional: true
- assertVisible:
    id: "customer-quote-accept"
- takeScreenshot: "06-quote-acceptance"
