appId: nl.vdbdigital.app
---
# 17 - Customer document upload screen
- clearState
- launchApp
- runFlow:
    file: shared/login.yaml
    env:
      EMAIL: customer.a@local.vdb
- extendedWaitUntil:
    visible:
      id: "customer-dashboard-screen"
    timeout: 60000
- tapOn:
    id: "tab-customer-more"
- tapOn:
    id: "nav-documents"
- tapOn:
    id: "customer-document-upload"
- assertVisible:
    id: "screen-document-upload"
- takeScreenshot: "17-customer-document-upload"
