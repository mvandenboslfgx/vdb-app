appId: nl.vdbdigital.app
---
# 17 — Customer document upload (register_document_upload RPC, see
# 20260720101600_business_flow_completion.sql). File picker interaction
# is not scriptable headlessly, so the picker tap is optional.
# Device execution: BLOCKED until adb available.
- launchApp
- tapOn:
    text: "Documents"
    optional: true
- tapOn:
    id: "btn-document-upload-cta"
    optional: true
- inputText:
    id: "input-document-upload-title"
    text: "Maestro Upload"
    optional: true
- tapOn:
    id: "btn-document-upload-pick"
    optional: true
- tapOn:
    id: "btn-document-upload-submit"
    optional: true
- takeScreenshot: "17-customer-document-upload"
