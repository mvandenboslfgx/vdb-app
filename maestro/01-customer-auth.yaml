appId: nl.vdbdigital.app
---
# 01 - Customer auth (clear state, login customer.a)
# Start: logged out | User: customer.a@local.vdb | Locale: NL (testIDs)
- clearState
- launchApp
- runFlow:
    file: shared/login.yaml
    env:
      EMAIL: customer.a@local.vdb
- extendedWaitUntil:
    visible:
      id: 'customer-dashboard-screen'
    timeout: 60000
- assertVisible:
    id: 'customer-dashboard-screen'
- takeScreenshot: '01-customer-auth'
