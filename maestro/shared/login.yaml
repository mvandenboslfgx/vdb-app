# Shared: open login from cold start (app data cleared by parent).
# Env: EMAIL
# Password is shell-safe LocalTestVdb2026 (no !).
# Requires Metro on :8081 + adb reverse for the debug APK.
# Login fields use importantForAutofill=no to block Samsung Pass corruption.
appId: nl.vdbdigital.app
---
- runFlow:
    file: dismiss-overlays.yaml
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "btn-public-login"
    timeout: 90000
- tapOn:
    id: "btn-public-login"
- extendedWaitUntil:
    visible:
      id: "auth-login-screen"
    timeout: 30000
- tapOn:
    id: "auth-email-input"
- eraseText
- inputText: ${EMAIL}
- tapOn:
    id: "auth-password-input"
- eraseText
- inputText: "LocalTestVdb2026"
- hideKeyboard
- tapOn:
    id: "auth-login-submit"
- runFlow:
    file: dismiss-overlays.yaml
- waitForAnimationToEnd
- runFlow:
    file: dismiss-overlays.yaml
# Leave auth screen or fail here (do not pretend login succeeded).
- extendedWaitUntil:
    notVisible:
      id: "auth-login-screen"
    timeout: 60000
