# Shared: dismiss Samsung Pass / autofill save prompts only.
# Keep this minimal — long optional tap chains destabilize USB Maestro sessions.
appId: nl.vdbdigital.app
---
- tapOn:
    id: 'android:id/autofill_save_no'
    optional: true
- tapOn:
    id: 'android:id/autofill_save_never_allow'
    optional: true
- tapOn:
    text: 'Nee'
    optional: true
- tapOn:
    text: 'No'
    optional: true
