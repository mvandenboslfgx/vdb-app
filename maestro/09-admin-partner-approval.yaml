appId: nl.vdbdigital.app
---
# 09 - Admin partner approval (pending partner application from seed / flow 08)
- clearState
- launchApp
- runFlow:
    file: shared/login.yaml
    env:
      EMAIL: admin@local.vdb
- extendedWaitUntil:
    visible:
      id: "admin-dashboard-screen"
    timeout: 60000
- tapOn:
    id: "tab-admin-approvals"
- assertVisible:
    id: "screen-admin-approvals"
- scrollUntilVisible:
    element:
      id: "admin-partner-approve"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "admin-partner-approve"
- tapOn:
    id: "admin-partner-approve"
- takeScreenshot: "09-admin-partner-approval"
