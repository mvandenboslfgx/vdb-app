appId: nl.vdbdigital.app
---
# 02 - Project request
- clearState
- launchApp
- runFlow:
    file: shared/login.yaml
    env:
      EMAIL: customer.a@local.vdb
- extendedWaitUntil:
    visible:
      id: 'customer-dashboard-screen'
    timeout: 60000
- tapOn:
    id: 'tab-customer-projects'
- tapOn:
    id: 'btn-projects-request'
- assertVisible:
    id: 'screen-project-request'
- tapOn:
    id: 'input-project-request-title'
- eraseText
- inputText: 'Maestro project request'
- tapOn:
    id: 'input-project-request-description'
- eraseText
- inputText: 'Created by Maestro device flow 02'
- tapOn:
    id: 'input-project-request-title'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'btn-project-request-submit'
    direction: DOWN
    timeout: 10000
- tapOn:
    id: 'btn-project-request-submit'
- extendedWaitUntil:
    visible:
      id: 'screen-project-request-success'
    timeout: 20000
- takeScreenshot: '02-project-request'
