appId: nl.vdbdigital.app
---
# 07 - Test checkout start (fake / fail-closed safe)
- clearState
- launchApp
- runFlow:
    file: shared/login.yaml
    env:
      EMAIL: customer.a@local.vdb
- extendedWaitUntil:
    visible:
      id: "customer-dashboard-screen"
    timeout: 60000
- tapOn:
    id: "tab-customer-more"
- tapOn:
    id: "nav-invoices"
- extendedWaitUntil:
    visible:
      id: "invoice-row-0"
    timeout: 20000
- tapOn:
    id: "invoice-row-0"
- extendedWaitUntil:
    visible:
      id: "screen-invoice-detail"
    timeout: 30000
- assertVisible:
    id: "customer-checkout-start"
- takeScreenshot: "07-test-checkout"
