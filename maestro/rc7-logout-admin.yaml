appId: nl.vdbdigital.app
---
- tapOn:
    id: 'tab-admin-more'
    optional: true
- scrollUntilVisible:
    element:
      id: 'auth-logout-button'
    direction: DOWN
    timeout: 15000
- tapOn:
    id: 'auth-logout-button'
- runFlow:
    file: shared/dismiss-overlays.yaml
- extendedWaitUntil:
    visible:
      id: 'btn-public-login'
    timeout: 30000
- takeScreenshot: 'after-admin-logout'
