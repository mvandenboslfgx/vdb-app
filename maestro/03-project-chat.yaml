appId: nl.vdbdigital.app
---
# 03 — Project chat send
# Start: logged out → customer.a | Needs seeded conversation
- clearState
- launchApp
- runFlow:
    file: shared/login.yaml
    env:
      EMAIL: customer.a@local.vdb
- extendedWaitUntil:
    visible:
      id: "customer-dashboard-screen"
    timeout: 30000
- tapOn:
    id: "tab-customer-messages"
- tapOn:
    id: "conversation-row-0"
- assertVisible:
    id: "screen-message-thread"
- tapOn:
    id: "customer-chat-input"
- inputText: "Maestro chat ping"
- tapOn:
    id: "customer-chat-send"
- takeScreenshot: "03-project-chat"
