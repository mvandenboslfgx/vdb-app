appId: nl.vdbdigital.app
---
# 05 - Document review open + approve controls
- clearState
- launchApp
- runFlow:
    file: shared/login.yaml
    env:
      EMAIL: customer.a@local.vdb
- extendedWaitUntil:
    visible:
      id: 'customer-dashboard-screen'
    timeout: 60000
- tapOn:
    id: 'tab-customer-more'
- tapOn:
    id: 'nav-documents'
- assertVisible:
    id: 'screen-documents'
- tapOn:
    id: 'document-row-0'
- assertVisible:
    id: 'screen-document-detail'
- tapOn:
    id: 'btn-document-open'
    optional: true
- takeScreenshot: '05-document-review'
