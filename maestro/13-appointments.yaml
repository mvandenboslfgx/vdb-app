appId: nl.vdbdigital.app
---
# 13 - Appointments list + book entry
- clearState
- launchApp
- runFlow:
    file: shared/login.yaml
    env:
      EMAIL: customer.a@local.vdb
- extendedWaitUntil:
    visible:
      id: "customer-dashboard-screen"
    timeout: 60000
- tapOn:
    id: "tab-customer-more"
- scrollUntilVisible:
    element:
      id: "nav-appointments"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "nav-appointments"
- extendedWaitUntil:
    visible:
      id: "screen-appointments"
    timeout: 30000
- tapOn:
    id: "btn-appointments-book"
- extendedWaitUntil:
    visible:
      id: "screen-appointments-book"
    timeout: 30000
- takeScreenshot: "13-appointments"
