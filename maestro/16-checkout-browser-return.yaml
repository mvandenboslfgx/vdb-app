appId: nl.vdbdigital.app
---
# 16 - Checkout browser return (invoice detail + checkout CTA visible)
# Browser return is asserted by remaining on invoice detail after optional checkout tap.
- clearState
- launchApp
- runFlow:
    file: shared/login.yaml
    env:
      EMAIL: customer.a@local.vdb
- extendedWaitUntil:
    visible:
      id: "customer-dashboard-screen"
    timeout: 60000
- tapOn:
    id: "tab-customer-more"
- tapOn:
    id: "nav-invoices"
- extendedWaitUntil:
    visible:
      id: "invoice-row-0"
    timeout: 20000
- tapOn:
    id: "invoice-row-0"
- extendedWaitUntil:
    visible:
      id: "screen-invoice-detail"
    timeout: 30000
- assertVisible:
    id: "customer-checkout-start"
- takeScreenshot: "16-checkout-browser-return"
