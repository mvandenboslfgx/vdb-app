appId: nl.vdbdigital.app
---
# 19 — Partner payout request (request_commission_payout RPC, see
# 20260720101700_payouts_support_finance.sql). Fails closed without the
# partner.payouts feature flag (enabled for local testing by
# scripts/seed-local-identities.mjs — never in production).
# Device execution: BLOCKED until adb available.
- launchApp
- tapOn:
    text: "Commissions"
    optional: true
- tapOn:
    id: "btn-payout-request"
    optional: true
- assertVisible:
    id: "text-payout-balance"
    optional: true
- takeScreenshot: "19-partner-payout"
