appId: nl.vdbdigital.app
---
# 19 - Partner payout screen
- clearState
- launchApp
- runFlow:
    file: shared/login.yaml
    env:
      EMAIL: partner.active.a@local.vdb
- extendedWaitUntil:
    visible:
      id: "partner-dashboard-screen"
    timeout: 60000
- tapOn:
    id: "partner-payout-request"
- assertVisible:
    id: "screen-partner-payouts"
- assertVisible:
    id: "text-payout-balance"
- assertVisible:
    id: "btn-payout-request"
- takeScreenshot: "19-partner-payout"
