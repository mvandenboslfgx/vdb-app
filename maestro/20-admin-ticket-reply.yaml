appId: nl.vdbdigital.app
---
# 20 — Admin support ticket reply (admin_reply_support_ticket RPC, see
# 20260720101700_payouts_support_finance.sql). Covers a public reply
# (flips ticket to waiting_on_customer) and a staff-only internal note.
# Device execution: BLOCKED until adb available.
- launchApp
- tapOn:
    text: "Tickets"
    optional: true
- tapOn:
    text: "Seed support ticket"
    optional: true
- inputText:
    id: "input-ticket-reply"
    text: "Maestro reply from staff"
    optional: true
- tapOn:
    id: "btn-ticket-send-reply"
    optional: true
- tapOn:
    id: "toggle-ticket-reply-internal"
    optional: true
- inputText:
    id: "input-ticket-reply"
    text: "Maestro internal note"
    optional: true
- tapOn:
    id: "btn-ticket-send-reply"
    optional: true
- takeScreenshot: "20-admin-ticket-reply"
