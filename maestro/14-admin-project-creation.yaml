appId: nl.vdbdigital.app
---
# 14 — Admin queue / approvals (project creation UI not present; approvals is the live queue)
- clearState
- launchApp
- runFlow:
    file: shared/login.yaml
    env:
      EMAIL: admin@local.vdb
- extendedWaitUntil:
    visible:
      id: "admin-dashboard-screen"
    timeout: 30000
- tapOn:
    id: "tab-admin-approvals"
- assertVisible:
    id: "screen-admin-approvals"
- takeScreenshot: "14-admin-project-creation"
