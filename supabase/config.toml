# VDB Digital Mobile — local Supabase configuration
# STATUS: local development only. Remote migrations are NOT APPLIED.
# Project ref (remote, read-only reference): nhsrdnjfsxfikfbdmdfj ("vdb nieuw")
#
# Port block 5452x is reserved for this Mobile stack so it does not collide with:
# - vdbdigital2 defaults (54321/54322)
# - vdb-partners (54421/54422)

project_id = "vdb-digital-mobile-local"

[api]
enabled = true
port = 54521
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54522
shadow_port = 54520
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54523
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54524

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = [
  "vdbdigital://",
  "https://vdbdigital.nl/app",
  "exp://127.0.0.1:8081"
]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.sms]
enable_signup = false

[edge_runtime]
enabled = true
policy = "per_worker"

[analytics]
enabled = false
