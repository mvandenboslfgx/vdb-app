name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint Typecheck Test Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --ci --passWithNoTests

      - name: Translation key check
        run: npm run check:translations

      - name: Secret scan
        run: npm run secret-scan

      - name: Migration header check
        shell: bash
        run: |
          set -euo pipefail
          for f in supabase/migrations/*.sql; do
            head -n 1 "$f" | grep -Eq 'STATUS: NOT APPLIED' || {
              echo "Missing NOT APPLIED header: $f" >&2
              exit 1
            }
          done

      - name: Expo Doctor
        run: npm run doctor
